<app-navbar></app-navbar>
<main class="relative bg-main overflow-hidden">
  <div class="absolute inset-0 bg-grid-fineline pointer-events-none"></div>
  <div
    class="min-h-screen relative grid grid-cols-1 md:grid-cols-2 items-center gap-8 md:gap-2 px-6 md:px-12 lg:px-20"
  >
    <!-- Columna texto -->
<div class="space-y-4 z-10">
  <h1 class="flex flex-col leading-[0.85] tracking-tighter">
    <span class="text-6xl md:text-8xl font-light text-secondary opacity-50">
      ¡HOLA!
    </span>
    <span class="text-7xl md:text-[120px] lg:text-[150px] font-black text-outline text-transparent uppercase">
      SOY
    </span>
    <span class="text-7xl md:text-[120px] lg:text-[120px] font-black text-main uppercase italic">
      Alejandro
    </span>
  </h1>
  
  <p class="text-xl md:text-2xl text-secondary max-w-lg mt-8 font-light">
    Desarrollador <span class="text-accent font-bold">Fullstack</span>. 
    Especialista en Angular & Spring Boot.
  </p>
</div>

    <!-- Columna imagen -->
    <div class="relative flex justify-center items-center">
      <!-- Fondo elegante detrás de la imagen -->
      <div
        class="absolute aspect-square w-[260px] sm:w-[450px] md:w-[380px] lg:w-[400px] rounded-full bg-[var(--text-main)] opacity-90 blur-[1px]"
      ></div>

      <!-- Imagen -->
      <img
        src="assets/img/p1.png"
        alt="Foto de Alejandro"
        class="relative z-10 rounded-full w-[220px] sm:w-[200px] md:w-[300px] lg:w-[360px] sm:-translate-y-5"
      />
    </div>
  </div>
  <!-- Scroll indicator -->
  <div
    class="absolute bottom-6 left-1/2 -translate-x-1/2 flex flex-col items-center text-main animate-bounce opacity-80 pointer-events-none scroll-indicator"
  >
    <!-- Icono flecha -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-6 h-6"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </div>

  <router-outlet></router-outlet>
</main>
<app-footer></app-footer>
