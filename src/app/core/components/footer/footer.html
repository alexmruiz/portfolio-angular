<footer class="relative bg-[var(--bg-main)] pt-20 pb-10 overflow-hidden border-t border-white/5">
  <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full h-32 bg-[var(--accent)] opacity-[0.03] blur-[100px] pointer-events-none"></div>

  <div class="container mx-auto px-6 relative z-10">
    <div class="flex flex-col items-center space-y-12">
      
      <div class="text-2xl font-bold tracking-tighter text-[var(--text-main)]">
        AMR<span class="text-[var(--accent)]">.</span>DEV
      </div>

      <div class="flex items-center gap-6">
        @for (social of socials; track social.name) {
          <a [href]="social.url" 
             target="_blank"
             class="group relative flex items-center justify-center w-12 h-12 rounded-xl bg-[var(--bg-surface)] border border-white/5 
                    hover:border-[var(--accent)]/50 transition-all duration-300 hover:-translate-y-1 shadow-lg"
             [attr.aria-label]="social.name">
            
            <i [class]="social.icon" class="text-xl text-[var(--text-secondary)] group-hover:text-[var(--accent)] transition-colors"></i>
            
            <span class="absolute -top-10 scale-0 group-hover:scale-100 transition-all duration-200 
                         bg-[var(--bg-surface)] text-[var(--accent)] text-xs font-mono py-1 px-3 rounded border border-[var(--accent)]/30
                         shadow-[0_0_15px_rgba(100,255,218,0.2)]">
              {{ social.name }}
            </span>
          </a>
        }
      </div>

      <div class="flex flex-col items-center space-y-2 text-center">
        <p class="text-[var(--text-secondary)] text-sm font-medium tracking-wide">
          © {{ currentYear }} — Alejandro Moya
        </p>
        <p class="text-[var(--text-secondary)]/50 text-xs flex items-center gap-2">
          Hecho con <span class="text-red-500 animate-pulse">❤️</span>
          <span class="hidden md:inline text-[var(--text-secondary)]/30">|</span>
          <span class="font-mono text-[10px]">v1.0.0</span>
        </p>
      </div>

    </div>
  </div>
</footer>
