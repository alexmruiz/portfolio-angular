<div
  class="fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex items-center justify-center p-4"
>
  <!-- CONTENEDOR DEL MODAL (NO SCROLL) -->
  <div
    class="bg-[var(--bg-surface)] w-full max-w-4xl rounded-3xl border border-white/10 overflow-hidden animate-[modalIn_0.4s]"
  >
    <!-- HEADER FIJO -->
    <header class="flex justify-end p-4 bg-[var(--bg-surface)]/80 border-b border-white/10">
      <button (click)="close.emit()" class="text-white hover:text-accent transition">✕</button>
    </header>
    <!-- CONTENIDO DEL MODAL (SCROLL) -->
    <div class="max-h-[70vh] overflow-y-auto modal-scroll p-8 space-y-8">
      <div class="aspect-video rounded-2xl overflow-hidden bg-black">
        @if (videoUrl) {
        <iframe [src]="videoUrl" class="w-full h-full" allowfullscreen></iframe>
        } @else {
        <img [src]="project.image" class="w-full h-full object-cover" />
        }
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-4">
          <h2 class="text-3xl font-bold">{{ project.title }}</h2>
          <p class="text-lg text-[var(--text-secondary)]">
            {{ project.fullDesc }}
          </p>
        </div>

        <div class="space-y-6">
          <div class="p-6 rounded-2xl bg-white/5 border border-white/5">
            <span class="text-xs uppercase tracking-widest text-accent block mb-4">
              Tecnologías
            </span>

            <div class="flex flex-wrap gap-2">
              @for (t of project.tech; track t) {
              <span class="px-3 py-1 bg-white/5 rounded text-sm">
                {{ t }}
              </span>
              }
            </div>
          </div>

          <a
            [href]="project.repoUrl"
            target="_blank"
            class="group relative block w-full text-center py-4 rounded-xl font-semibold bg-accent text-[var(--bg-main)] transition-all duration-300 ease-out hover:-translate-y-1 hover:shadow-[0_12px_30px_var(--accent-glow)] focus:outline-none focus:ring-2 focus:ring-accent/50"
          >
            Ver Repositorio
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
