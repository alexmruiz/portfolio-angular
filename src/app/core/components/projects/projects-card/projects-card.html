<div
  (click)="select.emit()"
  class="group cursor-pointer rounded-2xl overflow-hidden bg-[var(--bg-surface)]
         border border-[var(--grid-color)]
         transition-all duration-500 hover:-translate-y-3 hover:shadow-2xl"
>
  <div class="aspect-video relative overflow-hidden">
    <img
      [src]="project.image"
      [alt]="project.title"
      class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
    />
    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
  </div>

  <div class="p-6 space-y-3">
    <h3 class="text-xl font-bold">{{ project.title }}</h3>
    <p class="text-sm text-[var(--text-secondary)] line-clamp-2">
      {{ project.shortDesc }}
    </p>

    <div class="flex flex-wrap gap-2 pt-2">
      @for (t of project.tech; track t) {
        <span
          class="px-3 py-1 rounded-full text-[10px] uppercase bg-white/5 border border-white/10"
        >
          {{ t }}
        </span>
      }
    </div>
  </div>
</div>
