<div
  (click)="select.emit()"
  class="group flex h-full cursor-pointer flex-col overflow-hidden rounded-2xl bg-[var(--bg-surface)]
         border border-[var(--grid-color)]
         transition-all duration-500 hover:-translate-y-3 hover:shadow-2xl"
>
  <div class="relative aspect-video shrink-0 overflow-hidden">
    <img
      [src]="project.image"
      [alt]="project.title"
      class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
    />
    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
  </div>

  <div class="flex flex-1 flex-col gap-3 p-6">
    <h3 class="line-clamp-2 min-h-14 text-xl font-bold">{{ project.title }}</h3>
    <p class="min-h-10 line-clamp-2 text-sm text-[var(--text-secondary)]">
      {{ project.shortDesc }}
    </p>

    <div class="mt-auto flex min-h-14 flex-wrap content-start gap-2 pt-2">
      @for (t of project.tech.slice(0, 4); track t) {
        <span
          class="whitespace-nowrap rounded-full border border-white/10 bg-white/5 px-3 py-1 text-[10px] uppercase"
        >
          {{ t }}
        </span>
      }
      @if (project.tech.length > 4) {
        <span
          class="whitespace-nowrap rounded-full border border-white/10 bg-white/5 px-3 py-1 text-[10px] text-[var(--text-secondary)]"
        >
          +{{ project.tech.length - 4 }} más
        </span>
      }
    </div>
  </div>
</div>
