<section id="curriculum" class="relative py-24 min-h-screen">
  <div class="bg-grid-fineline opacity-20"></div>

  <div class="container mx-auto px-6 relative z-10">

    <!-- Header -->
    <div class="flex flex-col items-center text-center mb-16">
      <div class="relative inline-block">
        <h2 class="section-title">Trayectoria</h2>
        <div class="section-divider"></div>
      </div>
      <p class="mt-6 text-sm font-mono opacity-70 text-accent">
        // Formación y Experiencia Profesional
      </p>
    </div>

    <!-- Timeline -->
    <div class="max-w-4xl mx-auto">
      <div class="timeline space-y-12 pb-12">

        @for (item of cvData(); track $index) {
          <article
            class="relative group animation-fade-in"
            [style.animation-delay]="$index * 0.15 + 's'"
          >

            <!-- Punto -->
            <span class="timeline-dot"></span>

            <!-- Card -->
            <div class="timeline-card">
              <header class="flex flex-col md:flex-row md:items-center justify-between gap-2 mb-4">
                <div class="flex items-center gap-3">
                  <i
                    [class]="item.type === 'work'
                      ? 'fas fa-briefcase'
                      : item.type === 'education'
                      ? 'fas fa-graduation-cap'
                      : 'fas fa-certificate'"
                    class="timeline-icon"
                  ></i>

                  <h3 class="text-xl md:text-2xl font-bold text-[var(--text-main)]">
                    {{ item.title }}
                  </h3>
                </div>

                <span class="timeline-year">{{ item.year }}</span>
              </header>

              <span class="block font-medium mb-3 text-[var(--text-secondary)]">
                {{ item.subtitle }}
              </span>

              <p class="text-[var(--text-secondary)] opacity-80 leading-relaxed mb-0">
                {{ item.description }}
              </p>
            </div>

          </article>
        }

      </div>

      <!-- CTA -->
      <div class="flex justify-center mt-12">
        <button
          (click)="downloadCV()"
          class="btn-outline-accent"
        >
          <i class="fas fa-download mr-2"></i>
          Descargar Full CV (PDF)
        </button>
      </div>

    </div>
  </div>
</section>
